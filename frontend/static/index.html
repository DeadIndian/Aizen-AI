<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIZEN AI · 藍染 惣右介 · Anime Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=M+PLUS+Rounded+1c:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #0a0c13;
    --bg-card: rgba(18, 22, 36, 0.85);
    --border-color: rgba(168, 85, 247, 0.32);
    --primary-glow: #a855f7;
    --accent-cyan: #38bdf8;
    --accent-red: #f43f5e;
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'M PLUS Rounded 1c', sans-serif;
    background: radial-gradient(circle at 50% 10%, #1e1035 0%, #0d0e17 50%, #050608 100%);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  .anime-banner {
    background: linear-gradient(90deg, rgba(168, 85, 247, 0.15) 0%, rgba(56, 189, 248, 0.15) 100%);
    border-bottom: 1px solid var(--border-color);
    padding: 0.85rem 1.8rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(12px);
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .avatar-ring {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #a855f7, #38bdf8);
    padding: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 16px rgba(168, 85, 247, 0.6);
  }

  .avatar-ring img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    background: #000;
  }

  .title-block h1 {
    font-family: 'Cinzel', serif;
    font-size: 1.35rem;
    font-weight: 900;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #c084fc, #38bdf8, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-transform: uppercase;
  }

  .title-block p {
    font-size: 0.78rem;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  .persona-badge {
    background: rgba(168, 85, 247, 0.2);
    border: 1px solid rgba(168, 85, 247, 0.4);
    padding: 0.4rem 0.9rem;
    border-radius: 9999px;
    font-size: 0.78rem;
    color: #c084fc;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: 'JetBrains Mono', monospace;
  }

  .status-pulse {
    width: 8px;
    height: 8px;
    background: #34d399;
    border-radius: 50%;
    box-shadow: 0 0 8px #34d399;
  }

  /* Onboarding Card Banner */
  #onboarding-panel {
    background: linear-gradient(135deg, rgba(30, 20, 50, 0.92) 0%, rgba(15, 23, 42, 0.92) 100%);
    border: 1px solid var(--border-color);
    margin: 1rem auto 0 auto;
    padding: 1.2rem 1.6rem;
    border-radius: 16px;
    max-width: 900px;
    width: 92%;
    box-shadow: 0 8px 32px rgba(168, 85, 247, 0.25);
    backdrop-filter: blur(16px);
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
    animation: slideDown 0.35s ease-out;
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .onboard-title {
    font-family: 'Cinzel', serif;
    font-size: 1.1rem;
    font-weight: 800;
    color: #e2e8f0;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .onboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 0.8rem;
  }

  .onboard-field {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }

  .onboard-field label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
  }

  .onboard-field input, .onboard-field select {
    background: rgba(10, 12, 19, 0.8);
    border: 1px solid rgba(168, 85, 247, 0.3);
    color: #fff;
    padding: 0.6rem 0.8rem;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.85rem;
    outline: none;
  }

  .onboard-field input:focus, .onboard-field select:focus {
    border-color: #a855f7;
    box-shadow: 0 0 8px rgba(168, 85, 247, 0.4);
  }

  .onboard-actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.8rem;
  }

  .btn-primary {
    background: linear-gradient(135deg, #a855f7 0%, #38bdf8 100%);
    color: #fff;
    border: none;
    padding: 0.6rem 1.4rem;
    border-radius: 8px;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
    transition: transform 0.15s;
  }

  .btn-primary:hover {
    transform: scale(1.02);
  }

  .btn-secondary {
    background: transparent;
    border: 1px solid rgba(148, 163, 184, 0.3);
    color: var(--text-muted);
    padding: 0.6rem 1rem;
    border-radius: 8px;
    font-size: 0.82rem;
    cursor: pointer;
  }

  /* Chat Logs */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
  }

  .msg {
    display: flex;
    flex-direction: column;
    max-width: 85%;
    animation: fadeIn 0.25s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    align-items: flex-end;
  }

  .msg.agent {
    align-self: flex-start;
    align-items: flex-start;
  }

  .sender-tag {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 0.35rem;
    font-family: 'Cinzel', serif;
  }

  .bubble {
    padding: 0.95rem 1.3rem;
    border-radius: 16px;
    line-height: 1.6;
    font-size: 0.95rem;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.user .bubble {
    background: linear-gradient(135deg, #7e22ce 0%, #4338ca 100%);
    color: #fff;
    border: 1px solid rgba(216, 180, 254, 0.3);
    box-shadow: 0 4px 15px rgba(126, 34, 206, 0.35);
    border-bottom-right-radius: 4px;
  }

  .msg.agent .bubble {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: #e2e8f0;
    backdrop-filter: blur(14px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
    border-bottom-left-radius: 4px;
  }

  /* Quick Actions Bar */
  .quick-bar {
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    padding: 0.4rem 1.5rem;
    display: flex;
    gap: 0.6rem;
    overflow-x: auto;
  }

  .chip-btn {
    background: rgba(30, 41, 59, 0.7);
    border: 1px solid rgba(148, 163, 184, 0.2);
    color: #cbd5e1;
    padding: 0.4rem 0.85rem;
    border-radius: 9999px;
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }

  .chip-btn:hover {
    background: rgba(168, 85, 247, 0.25);
    border-color: #a855f7;
    color: #fff;
    transform: translateY(-1px);
  }

  /* Input Form */
  form {
    padding: 1.1rem 1.8rem;
    background: rgba(10, 12, 19, 0.95);
    border-top: 1px solid var(--border-color);
    display: flex;
    gap: 0.8rem;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    backdrop-filter: blur(12px);
  }

  input {
    flex: 1;
    padding: 0.85rem 1.2rem;
    border-radius: 12px;
    border: 1px solid rgba(168, 85, 247, 0.3);
    background: rgba(18, 22, 36, 0.8);
    color: #fff;
    font-size: 0.95rem;
    outline: none;
    font-family: inherit;
    transition: border 0.2s, box-shadow 0.2s;
  }

  input:focus {
    border-color: #a855f7;
    box-shadow: 0 0 12px rgba(168, 85, 247, 0.45);
  }

  button.submit-btn {
    background: linear-gradient(135deg, #a855f7 0%, #38bdf8 100%);
    color: #fff;
    border: none;
    padding: 0.85rem 1.6rem;
    border-radius: 12px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Cinzel', serif;
    letter-spacing: 1px;
    box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
    transition: transform 0.15s, opacity 0.15s;
  }

  button.submit-btn:hover {
    transform: scale(1.03);
    opacity: 0.95;
  }
</style>
</head>
<body>

<header class="anime-banner">
  <div class="brand-group">
    <div class="avatar-ring">
      <img src="https://api.iconify.design/lucide:swords.svg?color=%23ffffff" alt="Aizen" />
    </div>
    <div class="title-block">
      <h1>AIZEN AI · 藍染</h1>
      <p>Intelligent Anime Companion · Onboarding & Persona System</p>
    </div>
  </div>
  <div class="persona-badge" id="persona-display">
    <span class="status-pulse"></span>
    PERSONA: AIZEN SOSUKE
  </div>
</header>

<!-- ONBOARDING SECTION -->
<div id="onboarding-panel">
  <div class="onboard-title">
    ✨ Welcome to Aizen AI · Set Up Your Anime Profile
  </div>
  <div class="onboard-grid">
    <div class="onboard-field">
      <label>Favorite Anime Genres</label>
      <input id="pref-genres" placeholder="e.g. Shonen, Psychological, Dark Fantasy" value="Psychological, Dark Fantasy, Shonen">
    </div>
    <div class="onboard-field">
      <label>Favorite Anime Titles</label>
      <input id="pref-titles" placeholder="e.g. Bleach, Steins;Gate, Hunter x Hunter" value="Bleach, Death Note, Attack on Titan">
    </div>
    <div class="onboard-field">
      <label>Companion Character Persona</label>
      <select id="pref-persona">
        <option value="Aizen Sosuke" selected>Aizen Sosuke (Bleach) - Cold, Omniscient, Philosophical</option>
        <option value="Satoru Gojo">Satoru Gojo (JJK) - Playful, Cocky, Unmatched</option>
        <option value="Makima">Makima (Chainsaw Man) - Quiet, Controlling, Mysterious</option>
        <option value="Levi Ackerman">Levi Ackerman (AOT) - Blunt, Strict, Stoic</option>
        <option value="Kakashi Hatake">Kakashi Hatake (Naruto) - Relaxed, Wise, Chill</option>
      </select>
    </div>
    <div class="onboard-field">
      <label>Disliked Tropes / Skip</label>
      <input id="pref-dislikes" placeholder="e.g. Harem, excessive fan service" value="Generic isekai tropes">
    </div>
  </div>
  <div class="onboard-actions">
    <button class="btn-secondary" onclick="dismissOnboarding()">Skip for Now</button>
    <button class="btn-primary" onclick="submitOnboarding()">⚡ Synthesize Persona & Save Profile</button>
  </div>
</div>

<div id="log"></div>

<div class="quick-bar">
  <button class="chip-btn" onclick="sendPrompt('Hello! Who are you?')">👋 Say Hello</button>
  <button class="chip-btn" onclick="toggleOnboarding()">⚙️ Change Anime Taste / Persona</button>
  <button class="chip-btn" onclick="sendPrompt('Based on my taste, recommend me 3 anime to watch next!')">🎯 Personalized Recs</button>
  <button class="chip-btn" onclick="sendPrompt('What anime is currently trending worldwide?')">🔥 Trending Anime</button>
  <button class="chip-btn" onclick="sendPrompt('Show my watchlist')">📋 My Watchlist</button>
</div>

<form id="form">
  <input id="input" placeholder="Talk with your anime companion or ask for recommendations…" autocomplete="off" autofocus>
  <button type="submit" class="submit-btn">TRANSCEND</button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const onboardingPanel = document.getElementById("onboarding-panel");
const personaDisplay = document.getElementById("persona-display");
let sessionId = "";

function appendMsg(sender, text, isUser = false) {
  const container = document.createElement("div");
  container.className = "msg " + (isUser ? "user" : "agent");

  const tag = document.createElement("div");
  tag.className = "sender-tag";
  tag.textContent = sender;
  container.appendChild(tag);

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  container.appendChild(bubble);

  log.appendChild(container);
  log.scrollTop = log.scrollHeight;
  return bubble;
}

// Initial Greeting
appendMsg("AIZEN AI", "Welcome to Soul Society. Before we begin, configure your anime taste in the Onboarding section above so I can construct your customized companion persona!");

async function sendMessage(text) {
  if (!text) return;
  appendMsg("YOU", text, true);
  input.value = "";

  const thinkingBubble = appendMsg("COMPANION", "Thinking...");

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, session_id: sessionId })
    });
    const data = await res.json();
    if (data.session_id) sessionId = data.session_id;

    if (data.parts && Array.isArray(data.parts)) {
      const texts = data.parts.map(p => p.text || (p.kind === "text" ? p.text : "")).filter(Boolean);
      thinkingBubble.textContent = texts.join("\n\n") || "(No reply received)";
    } else {
      thinkingBubble.textContent = data.reply || "(No reply received)";
    }
  } catch (err) {
    thinkingBubble.textContent = "Error communicating with companion: " + err.message;
  }
}


function submitOnboarding() {
  const genres = document.getElementById("pref-genres").value;
  const titles = document.getElementById("pref-titles").value;
  const persona = document.getElementById("pref-persona").value;
  const dislikes = document.getElementById("pref-dislikes").value;

  personaDisplay.innerHTML = `<span class="status-pulse"></span> PERSONA: ${persona.toUpperCase()}`;
  onboardingPanel.style.display = "none";

  const setupPrompt = `Here are my anime onboarding preferences: My favorite genres are ${genres}. My favorite anime are ${titles}. Please roleplay as ${persona} as my anime companion from now on! I dislike ${dislikes}. Save this to my profile and introduce yourself in full character!`;
  sendMessage(setupPrompt);
}

function dismissOnboarding() {
  onboardingPanel.style.display = "none";
}

function toggleOnboarding() {
  onboardingPanel.style.display = onboardingPanel.style.display === "none" ? "flex" : "none";
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const val = input.value.trim();
  if (val) sendMessage(val);
});

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit"));
}
</script>

</body>
</html>
